[project]
name = "placement-practice"
version = "0.1.0"
description = "Spoken mock-interview practice: record an answer, get it transcribed and graded"
readme = "README.md"
requires-python = ">=3.14"
license = "Apache-2.0"
dependencies = [
    "fastapi>=0.141.1",
    "huggingface-hub>=1.26.0",
    "numpy>=2.5.1",
    "python-dotenv>=1.2.2",
    "python-multipart>=0.0.32",
    "soundfile>=0.14.0",
    "truststore>=0.10.4",
    "uvicorn[standard]>=0.52.0",
]

[project.scripts]
practice = "app:run"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app", "src"]

# Neither is a Python package, so packages= alone would build a wheel that starts up and
# then fails on the first query. Files are named one by one rather than force-including
# data/ wholesale: force-include ignores exclude=, so a directory would drag the local
# practice.db in with its accounts. tests/test_packaging.py fails the build if it ever does.
[tool.hatch.build.targets.wheel.force-include]
"data/questions.json" = "data/questions.json"
"src/db/schema.sql" = "src/db/schema.sql"
# The spoken bank. A directory is safe here where data/ would not be: it holds only
# generated .opus files, never the database. Whatever `python -m src.helpers.speech` has
# produced ships; a question with no file simply has no audio, which the route handles.
"data/audio" = "data/audio"

[dependency-groups]
dev = [
    "httpx2>=2.9.1",     # starlette TestClient
    "ruff>=0.16.1",
    "sounddevice>=0.5.5",  # poc_mic.py only; the app records in the browser
]

[tool.ruff]
target-version = "py314"
line-length = 100

[tool.ruff.lint.per-file-ignores]
# Form(...)/File(...) in defaults is how FastAPI declares multipart fields.
"app/main.py" = ["B008"]
