[project]
name = "placement-practice"
version = "0.1.0"
description = "Spoken mock-interview practice: record an answer, get it transcribed and graded"
readme = "README.md"
requires-python = ">=3.14"
license = "Apache-2.0"
dependencies = [
    "fastapi>=0.141.1",
    "huggingface-hub>=1.26.0",
    "numpy>=2.5.1",
    "python-dotenv>=1.2.2",
    "python-multipart>=0.0.32",
    "soundfile>=0.14.0",
    "truststore>=0.10.4",
    "uvicorn[standard]>=0.52.0",
]

[project.scripts]
practice = "app:run"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[dependency-groups]
dev = [
    "httpx2>=2.9.1",     # starlette TestClient
    "ruff>=0.16.1",
    "sounddevice>=0.5.5",  # poc_mic.py only; the app records in the browser
]

[tool.ruff]
target-version = "py314"
line-length = 100

[tool.ruff.lint.per-file-ignores]
# Form(...)/File(...) in defaults is how FastAPI declares multipart fields.
"app/main.py" = ["B008"]
